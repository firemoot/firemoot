# Firemoot toolchain - pinned for reproducible local + CI builds.
# `mise install` provisions everything below. See PLAN.md §1.
[tools]
java = "temurin-25.0.3+9.0.LTS"   # JDK 25 LTS: runs Scala 3.3 LTS; compact object headers (JEP 519) on-pitch for RSS
sbt  = "1.12.11"                  # >=1.12.7 fixes CVE-2026-32948
node = "22.22.3"                  # SDK support floor (Node 20 EOL Apr 2026)
"npm:pnpm" = "11.5.3"             # npm backend: aqua registry mis-packages the linux-x64 asset

[env]
# Surface the JDK to tools that read JAVA_HOME directly.
_.path = []
