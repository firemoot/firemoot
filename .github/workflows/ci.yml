name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scala:
    name: server (Scala)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache Coursier and sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**', '.scalafmt.conf') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Format check, compile and test
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck test

  sdk:
    name: sdk (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  codegen:
    name: SDK codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache Coursier and sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**', '.scalafmt.conf') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate OpenAPI document
        run: sbt -batch "server/runMain com.firemoot.OpenApiExport openapi.json"

      - name: Regenerate @firemoot/core
        run: pnpm --filter @firemoot/core run generate

      - name: Fail on drift
        run: |
          git add -A -- openapi.json sdk/ts/core/src/generated
          if ! git diff --cached --exit-code -- openapi.json sdk/ts/core/src/generated; then
            echo "::error::OpenAPI spec or generated SDK is stale. Run the codegen steps locally and commit the result."
            exit 1
          fi

  boot:
    name: Cold-boot gate (<15s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache Coursier and sbt
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
          key: sbt-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**', '.scalafmt.conf') }}
          restore-keys: sbt-${{ runner.os }}-

      - name: Build Docker image
        run: sbt -batch "server/Docker/publishLocal"

      - name: Boot the compose stack and assert healthy < 15s
        working-directory: deploy/compose
        run: |
          # Pre-pull the only remote image so the gate times boot, not the
          # registry download (firemoot:latest was just built locally).
          docker pull postgres:17
          start=$(date +%s)
          docker compose up -d
          healthy=0
          for _ in $(seq 1 150); do
            if curl -fsS localhost:6668/healthz >/dev/null 2>&1; then healthy=1; break; fi
            sleep 0.2
          done
          elapsed=$(( $(date +%s) - start ))
          echo "cold start to healthy: ${elapsed}s (healthy=${healthy})"
          curl -fsS localhost:6668/readyz || true
          docker compose logs firemoot || true
          docker compose down -v
          if [ "$healthy" -ne 1 ] || [ "$elapsed" -ge 15 ]; then
            echo "::error::cold start to healthy exceeded 15s (or never became healthy)"
            exit 1
          fi
