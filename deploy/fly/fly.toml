# Fly.io deployment for Firemoot (SPEC.md §11, PLAN.md M4.8).
#
# Firemoot holds long-lived WebSocket connections, so the single most important
# setting here is that the machine is NEVER idle-stopped: `auto_stop_machines`
# is off and `min_machines_running = 1`. A stopped machine drops every live
# socket; Fly's default scale-to-zero is wrong for a stateful chat backend.
#
# Set the app name and region, then provision the secrets (see README.md):
#   fly secrets set FIREMOOT_DB_HOST=... FIREMOOT_DB_USER=... \
#                   FIREMOOT_DB_PASSWORD=... FIREMOOT_API_SECRET=... \
#                   FIREMOOT_ADMIN_PASSWORD=...

app = "firemoot"
primary_region = "lhr"

[build]
  # Firemoot ships as a prebuilt image (sbt-native-packager output); Fly pulls it
  # rather than building from source. Once published to Docker Hub (PLAN.md §12)
  # this is the whole build config. Until then, push the locally built image to
  # Fly's registry and deploy that - see README.md ("Interim: before Docker Hub").
  image = "firemoot/firemoot:latest"

[env]
  FIREMOOT_HTTP_HOST = "0.0.0.0"
  FIREMOOT_HTTP_PORT = "6668"
  FIREMOOT_DB_NAME = "firemoot"
  FIREMOOT_DB_PORT = "5432"
  # FIREMOOT_DB_HOST / _USER / _PASSWORD, FIREMOOT_API_SECRET, FIREMOOT_ADMIN_PASSWORD
  # and any FIREMOOT_S3_* values are set via `fly secrets`, never committed here.

[http_service]
  internal_port = 6668
  force_https = true
  # Stateful WebSockets: keep one machine up and never auto-stop it.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    # Connection-based: a chat node holds many idle sockets, so scale on
    # concurrent connections, not requests/sec.
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"

# Cold-boot is a few seconds, so a 1GB shared machine fits the "$7 VPS" envelope;
# the JVM caps its heap at 75% of this via -XX:MaxRAMPercentage (baked into the image).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
