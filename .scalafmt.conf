version = "3.11.1"
runner.dialect = scala3
maxColumn = 100

align.preset = none
align.openParenCallSite = false
align.openParenDefnSite = false

newlines.source = keep
docstrings.style = Asterisk
docstrings.wrap = no

rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
rewrite.imports.sort = scalastyle
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
rewrite.trailingCommas.style = multiple

project.excludeFilters = ["target/"]

# The sbt meta-build (build.sbt + project/*.scala) is compiled as Scala 2.13
# (source3), so the Scala 3-only brace-removal rewrite must not touch it.
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = scala213source3
    rewrite.scala3.removeOptionalBraces = no
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala213source3
    rewrite.scala3.removeOptionalBraces = no
  }
}
