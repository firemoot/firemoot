packages:
  - "sdk/ts/*"
  - "sdk/test"
  - "sdk/stream-contract"
  - "admin"
  - "docs"
# testcontainers' transitive native deps. We talk to a local Docker socket, so
# ssh2/cpu-features (docker-over-SSH) never load native code, and protobufjs runs
# pure-JS - none need their postinstall build step.
allowBuilds:
  # esbuild (via VitePress) needs its postinstall to link its platform binary.
  esbuild: true
  # testcontainers' transitive native deps. We talk to a local Docker socket, so
  # ssh2/cpu-features (docker-over-SSH) never load native code, and protobufjs runs
  # pure-JS - none need their postinstall build step.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # stream-chat and @stream-io/node-sdk (contract tests only): their postinstalls
  # just install husky git hooks for Stream's own repo; the published dist is used.
  "@stream-io/node-sdk": false
  stream-chat: false
